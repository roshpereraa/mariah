<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- antlers -->
    <path d="M14 15 L10 8 M10 8 L5 7 M10 8 L9 2 M30 15 L34 8 M34 8 L39 7 M34 8 L35 2"
          fill="none" stroke="#5a3620" stroke-width="2.6"/>
    <!-- ears -->
    <ellipse cx="9.5" cy="19.5" rx="4.4" ry="6" fill="#8c5a36" transform="rotate(-24 9.5 19.5)"/>
    <ellipse cx="34.5" cy="19.5" rx="4.4" ry="6" fill="#8c5a36" transform="rotate(24 34.5 19.5)"/>
    <!-- head -->
    <path d="M22 11c7.8 0 12.4 5.1 12.4 12.1 0 7.6-5.4 14.2-12.4 14.2S9.6 30.7 9.6 23.1C9.6 16.1 14.2 11 22 11z"
          fill="#a9703f" stroke="#6d4425" stroke-width="1.3"/>
    <!-- muzzle -->
    <ellipse cx="22" cy="30.6" rx="7.4" ry="5.9" fill="#d9ad7c"/>
    <!-- eyes -->
    <circle cx="16.8" cy="21.6" r="2.5" fill="#20120a"/>
    <circle cx="27.2" cy="21.6" r="2.5" fill="#20120a"/>
    <circle cx="17.7" cy="20.7" r=".9" fill="#fff"/>
    <circle cx="28.1" cy="20.7" r=".9" fill="#fff"/>
    <!-- glowing nose -->
    <circle cx="22" cy="31.4" r="5.2" fill="#ff3b4e" opacity=".32"/>
    <circle cx="22" cy="31.4" r="3.5" fill="#e3112a" stroke="#8d0516" stroke-width=".9"/>
    <circle cx="20.8" cy="30.2" r="1.1" fill="#ff9aa6"/>
    <!-- smile -->
    <path d="M18.6 35.2c1.9 1.5 4.9 1.5 6.8 0" fill="none" stroke="#7a4f2c" stroke-width="1.3"/>
  </g>
</svg>
